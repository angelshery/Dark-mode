<!DOCTYPE html>
<html>
<head>
    <title>Day and Night Theme</title>
    <!-- Connect the HTML file to the CSS file -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Main card containing the website content -->
    <div class="card">
        <h2 id="greeting">Good Morning!</h2>
    </div>

    <!-- Container for the image and button -->
    <div class="theme-controls">
        <!-- Image displayed for theme -->
        <img id="theme_image" src="day.jpg">
        <!-- Button used to switch between day and night themes -->
        <button id="theme_toggler">Switch to Night</button>
    </div>

    <!-- Connect the HTML file to the JavaScript file -->
    <script src="script.js"></script>
</body>
</html>
